spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true


#config JWT
etco.jwt.base64-secret=TAgHFnWz9BzxBOn1wzbOqWD26rAbTyB/9Hzn8cyJbyoFv7dzg4c0WxmbEbc1wUej6jIqtTmthJIGrQxrpmCUjg==
#expiration : 1 day
etco.jwt.access-token-validity-in-seconds=86400
