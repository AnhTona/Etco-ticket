#

etco.upload-file.base-uri=file:///home/tona/Downloads/uploads/
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
# Force upload file > 1MB to temp disk (not in RAM)
spring.servlet.multipart.file-size-threshold=1MB
spring.servlet.multipart.location=/tmp


spring.data.web.pageable.one-indexed-parameters=true

etco.ollama.base-url=http://localhost:11434
etco.ollama.chat-model=llama3.2-vision
etco.ollama.embedding-model=nomic-embed-text
# Keep model in VRAM for 30 minutes (no reload each request)
etco.ollama.keep-alive=30m

# RAG
etco.rag.chunk-size=1000
etco.rag.chunk-overlap=100
etco.rag.top-k=5
etco.rag.similarity-threshold=0.3
# Batch size for embedding (GPU processes in parallel)
etco.rag.embedding-batch-size=20

# Agent
etco.agent.max-iterations=5
etco.agent.temperature=0.7
